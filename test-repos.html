<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Test Repos</title>
  <style>
    body { font-family: monospace; padding: 20px; background: #1a1a1a; color: #0f0; }
    .repo { background: #2a2a2a; padding: 10px; margin: 10px 0; border-radius: 5px; }
    .error { color: #f00; }
    .success { color: #0f0; }
  </style>
</head>
<body>
  <h1>Test GitHub API</h1>
  <div id="status">Cargando...</div>
  <div id="repos"></div>

  <script>
    const API_URL = 'https://api.github.com/users/garcilaso05/repos';
    const statusDiv = document.getElementById('status');
    const reposDiv = document.getElementById('repos');

    console.log('Starting fetch from:', API_URL);

    fetch(API_URL)
      .then(response => {
        console.log('Response:', response);
        statusDiv.innerHTML = `<span class="success">Status: ${response.status} ${response.statusText}</span>`;
        return response.json();
      })
      .then(repos => {
        console.log('Repos received:', repos);
        statusDiv.innerHTML += `<br><span class="success">Total repos: ${repos.length}</span>`;
        
        repos.forEach(repo => {
          const div = document.createElement('div');
          div.className = 'repo';
          div.innerHTML = `
            <strong>${repo.name}</strong><br>
            ${repo.description || 'Sin descripción'}<br>
            <a href="${repo.html_url}" target="_blank">GitHub</a>
            ${repo.homepage ? ` | <a href="${repo.homepage}" target="_blank">Homepage</a>` : ''}
          `;
          reposDiv.appendChild(div);
        });
      })
      .catch(error => {
        console.error('Error:', error);
        statusDiv.innerHTML = `<span class="error">Error: ${error.message}</span>`;
      });
  </script>
</body>
</html>
